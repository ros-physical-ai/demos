# SO-ARM101 interactive-marker IK teleop configuration.
#
# Robot-specific values for the pai_rviz_teleop interactive_ik launch. Consumed
# by both the ik_servo and the marker adapter (the `/**` wildcard applies to
# both). Tuning parameters not listed here fall back to the node defaults.
/**:
  ros__parameters:
    # ---- IK servo: SO-ARM101 arm ----
    arm_joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint
    gripper_joint: gripper_joint
    ee_frame: gripper_frame_link
    root_frame: world

    # ---- Shared topics (servo <-> adapter) ----
    target_pose_topic: ik_servo/target_pose
    gripper_command_topic: ik_servo/gripper_command
    ee_pose_topic: ik_servo/ee_pose

    # ---- Interactive marker adapter: gripper ----
    has_gripper: true
    gripper_open_position: 1.7
    gripper_closed_position: 0.0
    gripper_speed: 1.0
