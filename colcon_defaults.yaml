# Defaults applied to every `colcon` invocation run from this directory, so a
# hand-typed `colcon build` inside `pixi shell` gets the same flags as the pixi
# tasks. Build type is set through the CMAKE_BUILD_TYPE environment variable
# (see [tasks] in pixi.toml) rather than here, because an explicit --cmake-args
# on the command line replaces these values instead of appending to them.
build:
  cmake-args:
    # robostack's lib*__rosidl_generator_py.so are built without linking
    # libpython, so anything that links them from a plain C++ process
    # (mujoco_ros2_control's hardware plugin, and its gtest targets) fails with
    # "undefined symbol: PyLong_FromLong" at dlopen. Link libpython explicitly
    # to supply the symbols; --no-as-needed is required because nothing in our
    # own code references a Python symbol directly, so the linker would
    # otherwise drop the dependency. The version tracks the `python` pin in
    # pixi.toml's [dependencies].
    - -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--no-as-needed,-lpython3.14
    - -DCMAKE_EXE_LINKER_FLAGS=-Wl,--no-as-needed,-lpython3.14
