name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libserial-dev

      - name: Import external repos
        run: |
          pip install vcstool
          vcs import external < pai.repos --recursive

      - name: Install Pixi
        run: curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.63.2 bash

      - name: Add Pixi to PATH
        run: echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install Pixi environment
        run: pixi install

      - name: Build
        run: pixi run build
