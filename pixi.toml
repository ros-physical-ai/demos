[workspace]
authors = ["Julia Jia <juliajster@gmail.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-lyrical"]
name = "demos"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[environments]
dev = ["dev"]
ci = ["ci"]

[feature.dev.tasks]
# Distinct from `build`: pixi refuses the same task name with different commands across environments.
build-debug = { cmd = ["colcon", "build", "--symlink-install"], env = { CMAKE_BUILD_TYPE = "Debug" } }

# feetech_ros2_driver doesn't build on macOS: libserial's BaudRate enum only
# defines rates above 230400 (incl. the 1,000,000 baud Feetech servos need)
# under `#ifdef __linux__`, since macOS's termios API doesn't expose them the
# same way. Upstream libserial/feetech_ros2_driver limitation.
#
# mujoco_vendor refuses to configure on Darwin (explicit CMake FATAL_ERROR).
# mujoco_ros2_control, mujoco_ros2_control_plugins, mujoco_3d_lidar, and
# mujoco_ros2_control_tests all depend on it. Upstream limitation; MuJoCo
# isn't supported on macOS (use Gazebo instead).
[feature.dev.target.osx-arm64.tasks]
build = { cmd = ["colcon", "build", "--symlink-install", "--packages-ignore", "feetech_ros2_driver", "mujoco_ros2_control", "mujoco_vendor", "mujoco_ros2_control_plugins", "mujoco_3d_lidar", "mujoco_ros2_control_tests", "--cmake-args", "-DCMAKE_BUILD_TYPE=Debug"] }

[feature.ci.activation.env]
CMAKE_INSTALL_MODE = "COPY"

[tasks]

# Lint
lint = { cmd = "pre-commit run --all-files" }

# Install dependencies
# Bring external repos via vcstool
install-source-deps = { cmd = "vcs import external --recursive < pai.repos" }
# Longer uv download timeout (PyTorch wheels are huge).
install-ml-deps = { cmd = "bash scripts/install_ml_deps.sh", env = { UV_HTTP_TIMEOUT = "600" } }
install-deps = { depends-on = ["install-source-deps", "install-ml-deps"] }

# Build
# cmake-args live in colcon_defaults.yaml (read from the workspace root).
build = { cmd = ["colcon", "build"], env = { CMAKE_BUILD_TYPE = "Release" } }
clean = { cmd = "rm -rf build install log" }

[target.osx-arm64.tasks]
build = { cmd = ["colcon", "build", "--packages-ignore", "feetech_ros2_driver", "mujoco_ros2_control", "mujoco_vendor", "mujoco_ros2_control_plugins", "mujoco_3d_lidar", "mujoco_ros2_control_tests", "--cmake-args", "-DCMAKE_BUILD_TYPE=Release"]}

# Run Demos
#
# All ros2-invoking tasks route through scripts/ros2_exec.sh: on macOS, dyld
# strips DYLD_LIBRARY_PATH from any process spawned through the SIP-protected
# system /bin/bash (including pixi's own task shell), breaking dlopen()-by-name
# lookups like ROS 2 typesupport loading for custom-built message packages.
# The wrapper rebuilds DYLD_LIBRARY_PATH from AMENT_PREFIX_PATH first. No-op
# on Linux.
zenoh-router = { cmd = [
  "scripts/ros2_exec.sh",
  "ros2",
  "run",
  "rmw_zenoh_cpp",
  "rmw_zenohd",
]}
so-arm-leader = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_leader_teleop", "leader_bringup.launch.py"] }
so-arm-real = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_bringup", "so_arm_real_bringup.launch.py"] }
so-arm-gz = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_bringup", "so_arm_gz_bringup.launch.py"] }
so-arm-mujoco = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_bringup", "so_arm_mujoco_bringup.launch.py"] }
so-arm-rviz-ik = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_bringup", "so_arm_rviz_ik.launch.py"] }
so-arm-phone-ik = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_bringup", "so_arm_phone_ik.launch.py"] }
rerun-viz = { cmd = ["scripts/ros2_exec.sh", "ros2", "launch", "pai_rerun_visualizer", "visualizer.launch.py"] }
rosetta-record-mujoco = { cmd = [
  "scripts/ros2_exec.sh",
  "ros2",
  "launch",
  "rosetta",
  "episode_recorder_launch.py",
  "contract_path:=$(ros2 pkg prefix pai_data_collection)/share/pai_data_collection/config/rosetta/so_arm101.yaml",
  "bag_base_dir:=datasets/so_arm101_mujoco/bags",
] }
test-joints = { cmd = [
  "scripts/ros2_exec.sh",
  "ros2",
  "topic",
  "pub",
  "/forward_position_controller/commands",
  "std_msgs/msg/Float64MultiArray",
  "{layout: {dim: [{label: joint, size: 6, stride: 1}]}, data: [0.2,-0.4,0,0,0,0.4]}",
  "--rate",
  "10",
]}

# usb_cam wraps V4L2, which only exists on Linux; camera nodes are unavailable
# on macOS (launch with use_cameras:=false there).
# evdev (via lerobot -> pynput) is Linux-only and publishes no Python 3.14
# wheel; take the conda-forge py314 build instead so pip never tries to
# compile it.
[target.linux-64.dependencies]
ros-lyrical-usb-cam = "*"
evdev = "*"

[target.linux-aarch64.dependencies]
ros-lyrical-usb-cam = "*"
evdev = "*"

[dependencies]
# Lint/Format
pre-commit = "*"

# Build deps
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=3.30.5,<4"
ninja = ">=1.13.1,<2"
# Conda C/C++ toolchain so the compiler matches conda's `ld` already on PATH.
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
vcstool = "*"
rosdep = "*"
ffmpeg = "*"
# Required by feetech_ros2_driver
cpp-expected = ">=1.1.0,<2"
range-v3 = ">=0.12.0,<0.13"
# Conda libserial: the system libserial-dev does not link against this sysroot.
libserial = "*"

# Common base deps
# robostack-lyrical only publishes py314 builds.
python = "3.14.*"
pip = "*"
# numpy<2.3 has no py314 builds; LeRobot's declared upper bound is <2.3.
numpy = ">=2.3,<3"
pinocchio = "*"
# Explicitly installing pillow through Conda (rather that letting pip pull it an as transitive dependency)
# to avoid related issue to: libtiff.so.6: undefined symbol: jpeg12_write_raw_data, version LIBJPEG_8.0.
pillow = "*"
# Pinned to <26 to satisfy lerobot packaging constraint (packaging>=24.2,<26.0)
packaging = ">=24.2,<26"
# >=80 dropped setup.py develop --editable, which ament_python's
# symlink-install build relies on.
setuptools = ">=71.0.0,<80"
protobuf = ">=6.31.1,<7"
# No cp314 wheels; conda so pip does not try to compile them.
labmaze = "*"

# ROS dependencies
ros-lyrical-ros-core = "*"
ros-lyrical-ament-cmake = "*"
# From pai_bringup
ros-lyrical-controller-manager = "*"
ros-lyrical-cv-bridge = "*"
ros-lyrical-launch = "*"
ros-lyrical-launch-ros = "*"
ros-lyrical-rclpy = "*"
ros-lyrical-robot-state-publisher = "*"
ros-lyrical-ros-gz-bridge = "*"
ros-lyrical-ros-gz-sim = "*"
ros-lyrical-ros2controlcli = "*"
# From pai_data_collection
ros-lyrical-rosbag2 = ">=0.33.0,<0.34"
ros-lyrical-rosbag2-py = "*"
ros-lyrical-rosbag2-storage-mcap = ">=0.33.0,<0.34"
# Gazebo Sim (provides gz CLI and simulation engine).
# Jetty (gz-sim 10); an Ionic pin would install a second, older Gazebo.
gz-sim = ">=10,<11"
# Gazebo GUI (required for gz sim -g)
gz-gui = ">=10,<11"
# Gazebo Rendering (required for ogre2 render engine plugin)
gz-rendering = ">=10,<11"
# Explicit majors so the solver cannot satisfy `sdformat` with an older Jetty-incompatible build.
sdformat-python = ">=16,<17"
gz-math-python = ">=9,<10"
ros-lyrical-rviz2 = "*"
ros-lyrical-sensor-msgs = "*"
ros-lyrical-std-msgs = "*"
ros-lyrical-xacro = "*"
# From so_arm100_description
ros-lyrical-joint-state-broadcaster = "*"
ros-lyrical-joint-trajectory-controller = "*"
ros-lyrical-parallel-gripper-controller = "*"
ros-lyrical-forward-command-controller = "*"
ros-lyrical-hardware-interface = "*"
ros-lyrical-transmission-interface = "*"
ros-lyrical-ament-index-python = "*"
ros-lyrical-gz-ros2-control = "*"
# From so_arm100_moveit_config
ros-lyrical-moveit-ros-move-group = "*"
ros-lyrical-moveit-kinematics = "*"
ros-lyrical-moveit-planners = "*"
ros-lyrical-moveit-simple-controller-manager = "*"
ros-lyrical-joint-state-publisher = "*"
ros-lyrical-joint-state-publisher-gui = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-moveit-ros-control-interface = "*"
ros-lyrical-moveit-ros-visualization = "*"
ros-lyrical-moveit-ros-warehouse = "*"
ros-lyrical-moveit-setup-assistant = "*"
ros-lyrical-rviz-common = "*"
ros-lyrical-rviz-default-plugins = "*"
# From feetech_ros2_driver
ros-lyrical-rclcpp = "*"
ros-lyrical-pluginlib = "*"
# Zenoh middleware
ros-lyrical-rmw-zenoh-cpp = "*"
ros-lyrical-camera-calibration = ">=7.0.0,<8"
# Differential inverse kinematics (Pink) + Pinocchio backend for the interactive marker IK demo.
pink = ">=3.1,<5"
nodejs = ">=18"
ros-lyrical-rosbridge-suite = ">=4.0.0,<5"
cbor2 = ">=6.1.2,<7"

# Force past LeRobot's upper bounds: no py314 numpy<2.3, and gz-msgs pins protobuf into the conda solve.
[pypi-options.dependency-overrides]
numpy = ">=2.3,<3"
protobuf = ">=6.31.1,<7"
# Released draccus cannot parse PEP-604 unions on Python 3.14 (dlwh/draccus#69).
# Pin a commit, not a branch, so pixi does not re-query the remote on every run.
draccus = { git = "https://github.com/devangpratap/draccus.git", rev = "6f3f164953a7a910eb284dd26720c560830737e1" }

[pypi-dependencies]
huggingface-hub = "*"
# LeRobot 0.5.x imports scipy.fftpack.idct (pi0_fast policy); SciPy 2.0 removed fftpack re-exports.
scipy = ">=1.11.0,<2"
lerobot = { version = "==0.5.1", extras = ["feetech", "async"] }
# pai_phone_teleop pulls in the upstream SpesRobotics/teleop package, which
# provides the WebXR phone bridge (python3 -m teleop.ros2). Its hard deps
# (uvicorn + fastapi<1.0) are listed explicitly here.
teleop = "==0.1.5"
fastapi = "<1.0"
uvicorn = "*"
# SDF→MJCF converter: used at launch time to convert the canonical SDF world to MuJoCo format.
# Installed from source (conda-forge 0.1.2 is too old for sdformat15).
# TODO(francocipollone): Point to upstream once the PR is merged: https://github.com/gazebosim/gz-mujoco/pull/125
sdformat-mjcf = { git = "https://github.com/francocipollone/gz-mujoco.git", rev = "79de56da1226568605d0aff35fa457aca10006e9", subdirectory = "sdformat_mjcf" }

[activation]
scripts = ["scripts/activate.sh"]

[activation.env]
# Ensures the linker knows where to look for conda managed packages
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
# CMake needs this to find ROS 2 packages installed by robostack
CMAKE_PREFIX_PATH = "${CONDA_PREFIX}"
# Gazebo rendering engine plugin path
GZ_RENDERING_ENGINE_PATH = "${CONDA_PREFIX}/lib/gz-rendering-10/engine-plugins"
ROS_DISTRO = "lyrical"
# Force ROS 2 to use Zenoh middleware
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
# uv/PyPI: large wheels (e.g. torch) need a longer per-request timeout than the default 30s
UV_HTTP_TIMEOUT = "600"
# Ignore the user site-packages dir (~/.local/lib/pythonX.Y/site-packages) so stray
# pip --user installs (e.g. cmeel .pth files) don't leak into the pixi environment.
PYTHONNOUSERSITE = "1"
