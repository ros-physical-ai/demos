[workspace]
authors = ["Julia Jia <juliajster@gmail.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-lyrical"]
name = "demos"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[environments]
dev = ["dev"]
ci = ["ci"]

[feature.dev.tasks]
# Named differently from the default `build` task on purpose: two environments
# defining the same task name with different commands makes `pixi run build`
# ambiguous and pixi refuses to pick one.
build-debug = { cmd = ["colcon", "build", "--symlink-install"], env = { CMAKE_BUILD_TYPE = "Debug" } }

[feature.ci.activation.env]
CMAKE_INSTALL_MODE = "COPY"

[tasks]

# Lint
lint = { cmd = "pre-commit run --all-files" }

# Longer uv download timeout (PyTorch wheels are huge).
install-ml-deps = { cmd = "bash scripts/install_ml_deps.sh", env = { UV_HTTP_TIMEOUT = "600" } }

# Build
# Shared cmake-args live in colcon_defaults.yaml, which colcon reads from the
# workspace root.
build = { cmd = ["colcon", "build"], env = { CMAKE_BUILD_TYPE = "Release" } }
clean = { cmd = "rm -rf build install log" }

# Run Demos
start_zenoh = { cmd = [
  "ros2",
  "run",
  "rmw_zenoh_cpp",
  "rmw_zenohd",
]}
so-arm-leader = { cmd = ["ros2", "launch", "pai_leader_teleop", "leader_bringup.launch.py"] }
so-arm-real = { cmd = ["ros2", "launch", "pai_bringup", "so_arm_real_bringup.launch.py"] }
so-arm-gz = { cmd = ["ros2", "launch", "pai_bringup", "so_arm_gz_bringup.launch.py"] }
so-arm-mujoco = { cmd = ["ros2", "launch", "pai_bringup", "so_arm_mujoco_bringup.launch.py"] }
so-arm-rviz-ik = { cmd = ["ros2", "launch", "pai_bringup", "so_arm_rviz_ik.launch.py"] }
so-arm-phone-ik = { cmd = ["ros2", "launch", "pai_bringup", "so_arm_phone_ik.launch.py"] }
rerun-viz = { cmd = ["ros2", "launch", "pai_rerun_visualizer", "visualizer.launch.py"] }
rosetta-record-mujoco = { cmd = [
  "ros2",
  "launch",
  "rosetta",
  "episode_recorder_launch.py",
  "contract_path:=$(ros2 pkg prefix pai_data_collection)/share/pai_data_collection/config/rosetta/so_arm101.yaml",
  "bag_base_dir:=datasets/so_arm101_mujoco/bags",
] }
test-joints = { cmd = [
  "ros2",
  "topic",
  "pub",
  "/forward_position_controller/commands",
  "std_msgs/msg/Float64MultiArray",
  "{layout: {dim: [{label: joint, size: 6, stride: 1}]}, data: [0.2,-0.4,0,0,0,0.4]}",
  "--rate",
  "10",
]}

[dependencies]
# Lint/Format
pre-commit = "*"

# Build deps
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=3.30.5,<4"
ninja = ">=1.13.1,<2"
# Build with the conda toolchain, not the system one. The environment already
# carries conda's binutils, which shadows the system `ld` on PATH; pairing that
# linker with /usr/bin/c++ resolves libpthread/libdl from the conda sysroot and
# fails with GLIBC_PRIVATE undefined references. It also matches how the
# robostack ROS packages themselves were built.
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
vcstool = "*"
rosdep = "*"
ffmpeg = "*"
# Required by feetech_ros2_driver
cpp-expected = ">=1.1.0,<2"
range-v3 = ">=0.12.0,<0.13"
# LibSerial from conda-forge rather than the system libserial-dev: linking the
# system copy against the conda toolchain's sysroot fails with GLIBC_PRIVATE
# undefined references (system glibc 2.39 vs sysroot 2.28).
libserial = "*"

# Common base deps
# robostack-lyrical only publishes py314 builds.
python = "3.14.*"
pip = "*"
# LeRobot declares numpy>=2.0.0,<2.3.0, but numpy has no py314 builds below
# 2.3.0 (required by robostack-lyrical). Forced past LeRobot's declared upper
# bound below via [pypi-options.dependency-overrides] since numpy<2.3 has no
# Python 3.14 support at all; untested combination, watch for numpy API
# breakage in LeRobot's ML code.
numpy = ">=2.3,<3"
pinocchio = "*"
# Explicitly installing pillow through Conda (rather that letting pip pull it an as transitive dependency)
# to avoid related issue to: libtiff.so.6: undefined symbol: jpeg12_write_raw_data, version LIBJPEG_8.0.
pillow = "*"
# Pinned to <26 to satisfy lerobot packaging constraint (packaging>=24.2,<26.0)
packaging = ">=24.2,<26"
# labmaze (via dm_control, pulled in by sdformat_mjcf) publishes no cp314 wheel
# and its sdist needs bazel to build. Take the conda-forge py314 build instead
# so pip never tries to compile it.
labmaze = "*"
# evdev (via lerobot -> pynput, Linux only) publishes no Python 3.14 wheel.
# Take the conda-forge py314 build instead so pip never tries to compile it.
evdev = "*"

# ROS dependencies
ros-lyrical-ros-core = "*"
ros-lyrical-ament-cmake = "*"
# From pai_bringup
ros-lyrical-controller-manager = "*"
ros-lyrical-cv-bridge = "*"
ros-lyrical-launch = "*"
ros-lyrical-launch-ros = "*"
ros-lyrical-rclpy = "*"
ros-lyrical-robot-state-publisher = "*"
ros-lyrical-ros-gz-bridge = "*"
ros-lyrical-ros-gz-sim = "*"
ros-lyrical-ros2controlcli = "*"
# From pai_data_collection
ros-lyrical-rosbag2 = ">=0.33.0,<0.34"
ros-lyrical-rosbag2-py = "*"
ros-lyrical-rosbag2-storage-mcap = ">=0.33.0,<0.34"
# Gazebo Sim (provides gz CLI and simulation engine).
# Gazebo Jetty, to match what ROS 2 Lyrical's ros_gz vendor packages pull in
# (libgz-sim >=10.4, libsdformat >=16, libgz-math >=9). Pinning the Ionic
# packages here instead installs a second, older Gazebo alongside it.
gz-sim = ">=10,<11"
# Gazebo GUI (required for gz sim -g)
gz-gui = ">=10,<11"
# Gazebo Rendering (required for ogre2 render engine plugin)
gz-rendering = ">=10,<11"
# Python bindings used by the MuJoCo bringup (SDF world -> MJCF conversion).
# Requested explicitly so the py314 builds matching the Jetty stack are picked;
# otherwise the solver is free to satisfy `sdformat` with an older major.
sdformat-python = ">=16,<17"
gz-math-python = ">=9,<10"
ros-lyrical-rviz2 = "*"
ros-lyrical-sensor-msgs = "*"
ros-lyrical-std-msgs = "*"
ros-lyrical-xacro = "*"
# From so_arm100_description
ros-lyrical-joint-state-broadcaster = "*"
ros-lyrical-joint-trajectory-controller = "*"
ros-lyrical-parallel-gripper-controller = "*"
# position_controllers/JointGroupPositionController is deprecated upstream in
# favor of forward_command_controller/ForwardCommandController with
# interface_name: position; robostack-lyrical no longer builds the old package.
ros-lyrical-forward-command-controller = "*"
ros-lyrical-hardware-interface = "*"
ros-lyrical-transmission-interface = "*"
ros-lyrical-ament-index-python = "*"
# nav2_common isn't published for robostack-lyrical yet; ros2_so_arm's
# so_arm100/101_description packages declare it as an exec_depend but don't
# actually use it (no find_package/nav2_package() call), so it's safe to omit.
ros-lyrical-gz-ros2-control = "*"
# From so_arm100_moveit_config
ros-lyrical-moveit-ros-move-group = "*"
ros-lyrical-moveit-kinematics = "*"
ros-lyrical-moveit-planners = "*"
ros-lyrical-moveit-simple-controller-manager = "*"
ros-lyrical-joint-state-publisher = "*"
ros-lyrical-joint-state-publisher-gui = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-moveit-ros-control-interface = "*"
ros-lyrical-moveit-ros-visualization = "*"
ros-lyrical-moveit-ros-warehouse = "*"
ros-lyrical-moveit-setup-assistant = "*"
ros-lyrical-rviz-common = "*"
ros-lyrical-rviz-default-plugins = "*"
# From feetech_ros2_driver
ros-lyrical-rclcpp = "*"
ros-lyrical-pluginlib = "*"
# Zenoh middleware
ros-lyrical-rmw-zenoh-cpp = "*"
# Camera driver
ros-lyrical-usb-cam = "*"
ros-lyrical-camera-calibration = ">=7.0.0,<8"
# Differential inverse kinematics (Pink) + Pinocchio backend for the interactive marker IK demo.
pink = ">=3.1,<5"
nodejs = ">=18"
ros-lyrical-rosbridge-suite = ">=4.0.0,<5"
cbor2 = ">=6.1.2,<7"

# Force numpy and protobuf past LeRobot's declared upper bounds. Both are the
# same py314 problem: robostack-lyrical only ships py314, and conda-forge has no
# py314 builds of numpy below 2.3.0 or of protobuf below 6.33 (protobuf is
# pinned into the conda solve by gz-msgs, so pip can't pick its own).
# Untested combinations upstream; watch for numpy API breakage in LeRobot's ML
# code, and for protobuf gencode/runtime warnings in lerobot's async client
# (6.33 runtime reading 6.31 gencode is forward-compatible).
[pypi-options.dependency-overrides]
numpy = ">=2.3,<3"
protobuf = ">=6.31.1,<7"
# LeRobot pins draccus==0.10.0, which cannot build its argument parser on
# Python 3.14: argparse now rejects a non-callable `type=`, and draccus passes
# PEP-604 unions (`str | None`) straight through. That breaks lerobot-train,
# lerobot-replay *and* Policy.from_pretrained, i.e. all of the ML pipeline.
# Both 0.10.0 and the latest 0.11.6 are affected (upstream issue dlwh/draccus#69),
# so pin the branch from the open fix PR until it is merged and released.
# TODO: point back at a released draccus once dlwh/draccus#70 lands.
# Pinned to a commit rather than a branch: a branch spec makes pixi re-query the
# remote on every `pixi run`/`pixi shell`, which re-locks and costs ~80s each time.
draccus = { git = "https://github.com/devangpratap/draccus.git", rev = "6f3f164953a7a910eb284dd26720c560830737e1" }

[pypi-dependencies]
huggingface-hub = "*"
# LeRobot 0.5.x imports scipy.fftpack.idct (pi0_fast policy); SciPy 2.0 removed fftpack re-exports.
scipy = ">=1.11.0,<2"
lerobot = { version = "==0.5.1", extras = ["feetech", "async"] }
# pai_phone_teleop pulls in the upstream SpesRobotics/teleop package, which
# provides the WebXR phone bridge (python3 -m teleop.ros2). Its hard deps
# (uvicorn + fastapi<1.0) are listed explicitly here.
teleop = "==0.1.5"
fastapi = "<1.0"
uvicorn = "*"
# SDF→MJCF converter: used at launch time to convert the canonical SDF world to MuJoCo format.
# Installed from source (conda-forge 0.1.2 is too old for sdformat15).
# TODO(francocipollone): Point to upstream once the PR is merged: https://github.com/gazebosim/gz-mujoco/pull/125
sdformat-mjcf = { git = "https://github.com/francocipollone/gz-mujoco.git", rev = "79de56da1226568605d0aff35fa457aca10006e9", subdirectory = "sdformat_mjcf" }

[activation]
scripts = ["scripts/activate.sh"]

[activation.env]
# Ensures the linker knows where to look for conda managed packages
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
# CMake needs this to find ROS 2 packages installed by robostack
CMAKE_PREFIX_PATH = "${CONDA_PREFIX}"
# Keep pkg-config inside the Pixi environment: mixing system .pc files with the
# conda toolchain produces sysroot/glibc link errors (see the libserial note).
PKG_CONFIG_PATH = "${CONDA_PREFIX}/lib/pkgconfig:${CONDA_PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH}"
# Gazebo rendering engine plugin path
GZ_RENDERING_ENGINE_PATH = "${CONDA_PREFIX}/lib/gz-rendering-10/engine-plugins"
# Build with the environment's own compilers (see the c-compiler/cxx-compiler
# note in [dependencies]); CMake would otherwise default to /usr/bin/c++.
CC = "${CONDA_PREFIX}/bin/gcc"
CXX = "${CONDA_PREFIX}/bin/g++"
ROS_DISTRO = "lyrical"
# Force ROS 2 to use Zenoh middleware
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
# uv/PyPI: large wheels (e.g. torch) need a longer per-request timeout than the default 30s
UV_HTTP_TIMEOUT = "600"
# Ignore the user site-packages dir (~/.local/lib/pythonX.Y/site-packages) so stray
# pip --user installs (e.g. cmeel .pth files) don't leak into the pixi environment.
PYTHONNOUSERSITE = "1"
