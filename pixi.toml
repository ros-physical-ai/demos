[workspace]
authors = ["juliaj <juliajster@gmail.com>"]
channels = ["conda-forge", "robostack-kilted"]
name = "demos"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
CMAKE_INSTALL_MODE = "SYMLINK"
COLCON_DEFAULT_OUTPUT_STYLE = "catkin_tools"
ROS_DISTRO = "kilted"
PKG_CONFIG_PATH = "/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

[activation]
scripts = ["/opt/ros/kilted/setup.bash", "../../install/setup.bash"]

[tasks]
# GPU detection
detect-gpu = { cmd = "bash scripts/detect_gpu_env.sh" }

# PyTorch and ML dependencies
install-rtx5090-pytorch = { cmd = "pip install torch==2.7.0+cu128 torchaudio==2.7.0+cu128 torchcodec==0.4.0 torchvision==0.22.0+cu128 --index-url https://download.pytorch.org/whl/cu128" }
install-standard-pytorch = { cmd = "pip install torch torchvision torchaudio" }
install-lerobot = { cmd = "pip install lerobot==0.3.3" }

# System setup
setup-ros = { cmd = "rosdep install --from-paths ../../src --ignore-src --rosdistro kilted -yir && sudo apt update && sudo apt install -y ros-kilted-ros-gz-sim" }
setup-so-arm100 = { cmd = "sudo apt update && sudo apt install -y libserial-dev" }
setup-colcon = { cmd = "pip install colcon-mixin && colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml && colcon mixin update default", cwd = "../.." }

# Build
build = { cmd = "colcon build --build-base build_${ROS_DISTRO} --install-base install_${ROS_DISTRO} --cmake-args -DCMAKE_BUILD_TYPE=Release", cwd = "../.." }

# Run
so-arm-gz-kilted = { cmd = "ros2 launch pai_bringup so_arm_gz_bringup.launch.py" }
lerobot-inference = { cmd = "python3 src/demos/pai_bringup/scripts/lerobot_inference_node --ros-args -p policy_path:=huggingface/lerobot/outputs/train/act_move_to_cube_2/checkpoints/last/pretrained_model -p camera_topic:=/camera -p command_topic:=/forward_position_controller/commands -p task:=\"Move to blue cube\" -p device:=cuda", cwd = "../.." }

# Test command
test-joint-commands = { cmd = "ros2 topic pub /forward_position_controller/commands std_msgs/msg/Float64MultiArray \"{layout: {dim: [{label: joint, size: 6, stride: 1}]}, data: [0.2,-0.4,0,0,0,0.4]}\" --rate 10" }

[dependencies]
python = "3.12.*"
pip = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
colcon-core = "*"
colcon-common-extensions = "*"
vcstool = "*"
rosdep = "*"
ffmpeg = "*"

[pypi-dependencies]
huggingface-hub = "*"
opencv-python = "*"
numpy = "*"

